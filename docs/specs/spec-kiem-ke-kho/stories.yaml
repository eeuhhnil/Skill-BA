- id: "1"
  title: Nền tảng phiếu kiểm kê
  description: >-
    Dựng mô hình phiếu kiểm kê theo CAP-1: tạo đợt, chọn phạm vi hàng hóa
    nhiều kiểu, chặn đợt chồng lấn trên cùng kho, hai trạng thái Chưa xử lý
    và Đã xử lý, xóa cứng phiếu nháp. Chưa đếm được và chưa chạm tồn kho.
  spec_checkpoint: true
  done_checkpoint: false

- id: "2"
  title: Snapshot và chốt tồn tại thời điểm đếm
  description: >-
    Hiện thực CAP-2 và CAP-3: ghi snapshot toàn phạm vi khi mở đợt, và ghi
    tồn hệ thống của đúng mã/lô tại đúng thời điểm mỗi dòng được đếm. Kèm
    ràng buộc chặn ghi lùi ngày khi kho đang có phiếu kiểm kê mở.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Đọc QT-2 trong quy-tac-nghiep-vu-can-chot.md trước khi thiết kế. Tuyệt
    đối không replay theo loại chứng từ: mỗi dòng đếm ghi kèm tồn hệ thống
    tại đúng thời điểm đếm, chênh lệch đóng băng ngay tại đó. Nguồn dữ liệu
    là sổ chuyển động tồn kho theo bộ ba (kho, mã hàng, lô), không phải một
    danh sách loại chứng từ liệt kê sẵn. Mốc thời gian dùng thời điểm tác
    động vào sổ tồn, không phải thời điểm tạo chứng từ.

- id: "3"
  title: Màn hình đếm
  description: >-
    Hiện thực CAP-4: nhập số thực tế bằng quét mã vạch hoặc gõ tay, chọn đơn
    vị tính có quy đổi, hiển thị tiến độ, lưu nháp liên tục. Mỗi dòng đếm
    mang thời điểm đếm của chính nó.
  spec_checkpoint: false
  done_checkpoint: false

- id: "4"
  title: Đếm theo lô và hạn dùng
  description: >-
    Hiện thực CAP-6: với hàng có quản lý lô, nhập số đếm tách theo từng lô
    thay vì chỉ tổng theo mã hàng. Phát hiện được trường hợp tổng khớp nhưng
    phân bổ giữa các lô bị lệch.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Cạm bẫy đã ghi nhận từ khảo sát đối thủ: ở Sapo, đưa một lô về 0 sẽ reset
    giá vốn của lô đó về 0. Đừng lặp lại.

- id: "5"
  title: Bảng đối chiếu chênh lệch và lý do lệch
  description: >-
    Hiện thực CAP-8, CAP-10 và phần hiển thị của CAP-9: cột tồn tại thời điểm
    đếm, số thực đếm, chênh lệch số lượng và chênh lệch quy ra tiền, lọc và
    sắp xếp được, phân biệt rõ mã chưa đếm với mã đếm ra 0, ô lý do lệch nhập
    tay cho từng dòng. Màn hình này chỉ đọc, chưa chạm tồn kho.
  spec_checkpoint: false
  done_checkpoint: false

- id: "6"
  title: Phân quyền sáu quyền
  description: >-
    Hiện thực CAP-12: tách sáu quyền độc lập gán được riêng cho từng vai trò
    là tạo phiếu, xem phiếu, sửa phiếu, cân bằng kho, in phiếu và nhập từ
    Excel. Phải hoàn thành trước story 7.
  spec_checkpoint: true
  done_checkpoint: false

- id: "7"
  title: Cân bằng kho và sinh chứng từ điều chỉnh
  description: >-
    Hiện thực CAP-9 phần popup, CAP-13 và CAP-14: popup thông báo mã chưa đếm,
    popup xác nhận cân bằng, sinh chứng từ điều chỉnh cập nhật tồn, và khóa
    bất biến phiếu sau khi chuyển sang Đã xử lý. Đây là story duy nhất làm
    thay đổi tồn kho thật.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Hai popup TÁCH RIÊNG, không gộp: popup mã chưa đếm của CAP-9 hiện trước,
    rồi mới tới popup xác nhận cân bằng của CAP-13. Mã chưa đếm không bao giờ
    được mặc định đưa về 0. Giá trị chênh lệch tính theo giá vốn tại thời
    điểm cân bằng kho, xem QT-1. Phiếu Đã xử lý bất biến tuyệt đối, kể cả với
    tài khoản có quyền sửa phiếu.

- id: "8"
  title: Nhập kết quả đếm từ Excel
  description: >-
    Hiện thực CAP-5: nạp số đếm từ file Excel với bảng xem trước liệt kê dòng
    lỗi, không ghi gì vào phiếu cho tới khi người dùng xác nhận. Người dùng
    khai được một thời điểm đếm cho cả lô import.
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    Trường thời điểm đếm cho cả lô import là bắt buộc, không phải tùy chọn
    trang trí. Cửa hàng đếm trên giấy lúc 8h rồi nhập lúc 17h mà lấy thời
    điểm import làm mốc thì toàn bộ giao dịch bán trong ngày bị tính nhầm
    thành chênh lệch.

- id: "9"
  title: Biên bản kiểm kê và tra cứu lịch sử
  description: >-
    Hiện thực CAP-15: in và xuất biên bản kiểm kê ra PDF với đủ thông tin các
    bên tham gia, và tra cứu lại lịch sử các đợt theo cửa hàng, theo kỳ và
    theo người thực hiện. Biên bản của phiếu Đã xử lý không sửa được.
  spec_checkpoint: false
  done_checkpoint: true
